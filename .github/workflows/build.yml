name: Build Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build aircard.exe (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aircard-windows-x64
          path: target/release/aircard.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/aircard.exe
          generate_release_notes: true
          draft: false
          prerelease: false

  build-linux:
    name: Build aircard (Linux x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: linux

      - name: Install libimobiledevice runtime
        # Only the shared libraries are needed: the build never links them and
        # the tests load them through dlopen, so no -dev package is installed.
        # These are the Ubuntu 24.04 names; Debian 13 and newer spell them
        # libimobiledevice-1.0-6 and libusbmuxd-2.0-7.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libimobiledevice6 libplist-2.0-4 libusbmuxd6 \
            libegl1 libgl1 libxkbcommon0 libwayland-client0

      - name: Run tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aircard-linux-x64
          path: target/release/aircard
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/aircard
          generate_release_notes: true
          draft: false
          prerelease: false
